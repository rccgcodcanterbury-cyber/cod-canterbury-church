[build]
  command = "npm ci && npm run build:netlify"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=dev"

[[redirects]]
  from = "/api/intake"
  to = "/.netlify/functions/intake"
  status = 200

[[redirects]]
  from = "/api/events"
  to = "/.netlify/functions/events"
  status = 200

[[redirects]]
  from = "/api/youtube-feed"
  to = "/.netlify/functions/youtube-feed"
  status = 200

[[redirects]]
  from = "/api/review-testimony"
  to = "/.netlify/functions/review-testimony"
  status = 200

[[redirects]]
  from = "/events.ics"
  to = "/.netlify/functions/events-ics"
  status = 200

