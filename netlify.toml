[build]
  command = "npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "22"
[dev]
  framework = "#static"
  publish = "dist"
port = 8888
[[redirects]]
  from = "/api/intake"
  to = "/.netlify/functions/intake"
  status = 200
[[redirects]]
  from = "/api/youtube-feed"
  to = "/.netlify/functions/youtube-feed"
  status = 200
[[redirects]]
  from = "/api/review-testimony"
  to = "/.netlify/functions/review-testimony"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
